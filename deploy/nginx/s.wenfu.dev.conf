# Short-link service — s.wenfu.dev
# scripts/deploy.sh 安装到 /etc/nginx/sites-available/s.wenfu.dev 并启用。
# 证书：certbot certonly --webroot -w /var/www/certbot -d s.wenfu.dev
upstream s_wenfu {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 443 ssl;
    server_name s.wenfu.dev;

    ssl_certificate /etc/letsencrypt/live/s.wenfu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s.wenfu.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 600k;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://s_wenfu;
    }
}

server {
    listen 80;
    server_name s.wenfu.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
